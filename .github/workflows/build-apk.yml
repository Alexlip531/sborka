name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sugar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Repo root listing ==="
          ls -la
          echo "=== Sugar/ listing ==="
          ls -la Sugar/ 2>/dev/null || echo "Sugar/ NOT FOUND"
          echo "=== Sugar/gradlew exists? ==="
          test -f Sugar/gradlew && echo "YES" || echo "NO"
          echo "=== Sugar/settings.gradle.kts ==="
          cat Sugar/settings.gradle.kts 2>/dev/null || echo "NOT FOUND"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (code $CODE)"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to sugar-<version>.apk
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/sugar-${{ steps.version.outputs.name }}.apk"
          ls -la artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sugar-${{ steps.version.outputs.name }}.apk
          path: Sugar/artifacts/sugar-${{ steps.version.outputs.name }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Sugar v${{ steps.version.outputs.name }}
          body: |
            ## Sugar v${{ steps.version.outputs.name }}

            Автоматическая сборка из коммита ${{ github.sha }}

            ### Установка
            1. Скачайте файл `sugar-${{ steps.version.outputs.name }}.apk` ниже
            2. Откройте его на телефоне
            3. Разрешите установку из неизвестных источников, если попросит
            4. Установите поверх старой версии (данные сохранятся)
          files: Sugar/artifacts/sugar-${{ steps.version.outputs.name }}.apk
          prerelease: false
